name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: make init-ci

      - name: Lint & format check
        run: make check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    services:
#      postgres:
#        image: postgres:16
#        env:
#          POSTGRES_USER: postgres
#          POSTGRES_PASSWORD: postgres
#          POSTGRES_DB: postgres
#        ports:
#          - 5432/tcp
#        options: >-
#          --health-cmd pg_isready
#          --health-interval 10s
#          --health-timeout 5s
#          --health-retries 5
#
#      mysql:
#        image: mysql:8.0
#        env:
#          MYSQL_ALLOW_EMPTY_PASSWORD: yes
#          MYSQL_DATABASE: orm
#        ports:
#          - 3306/tcp
#        options: >-
#          --health-cmd "mysqladmin ping"
#          --health-interval 10s
#          --health-timeout 5s
#          --health-retries 5
#
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: make init-ci

      - name: Run migrations
        env:
          POSTGRES_DATABASE_HOST: localhost
          POSTGRES_DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGRES_DATABASE_DATABASE: postgres
          POSTGRES_DATABASE_USER: postgres
          POSTGRES_DATABASE_PASSWORD: postgres
          MYSQL_DATABASE_HOST: localhost
          MYSQL_DATABASE_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_DATABASE_DATABASE: orm
          MYSQL_DATABASE_USER: root
          DB_CONFIG_PATH: tests/integrations/config/database.py
        run: |
          python orm migrate --connection postgres
          python orm migrate --connection mysql

      - name: Run tests
        env:
          POSTGRES_DATABASE_HOST: localhost
          POSTGRES_DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
          POSTGRES_DATABASE_DATABASE: postgres
          POSTGRES_DATABASE_USER: postgres
          POSTGRES_DATABASE_PASSWORD: postgres
          MYSQL_DATABASE_HOST: localhost
          MYSQL_DATABASE_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_DATABASE_DATABASE: orm
          MYSQL_DATABASE_USER: root
          DB_CONFIG_PATH: tests/integrations/config/database.py
        run: make test
