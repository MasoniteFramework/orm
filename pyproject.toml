[tool.black]
target-version = ['py38']
include = '\.pyi?$'
line-length = 79

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
ignore = ['E501', 'E203', 'E128', 'E402', 'E731', 'F821', 'E712', 'W503', 'F811']
#max-line-length = 79
#max-complexity = 18
per-file-ignores = [
    '__init__.py:F401',
]
